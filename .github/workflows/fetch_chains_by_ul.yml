name: Fetch CBOE Option Chains (par UL, manuel)

# Version separee du workflow principal (fetch_chains.yml) pour ne pas le casser.
# Declenchement UNIQUEMENT manuel (pas de cron ici) : onglet Actions -> ce
# workflow -> bouton "Run workflow".
# Range les fichiers dans data/<UL>/ au lieu de data/ a plat.
on:
  workflow_dispatch: {}

permissions:
  contents: write   # necessaire pour que le workflow puisse "git push" les CSV

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dependances
        run: pip install requests pandas xlsxwriter

      - name: Telecharger les chaines d'options
        run: python cboe_option_chain.py SPX AAPL VIX TSLA NDX BMNR META -o data

      - name: Ranger les fichiers dans un sous-dossier par UL
        run: |
          cd data
          shopt -s nullglob
          for f in *_chain_*.csv *_chain_*.xlsx *_raw_*.json; do
            ul="${f%%_*}"
            mkdir -p "$ul"
            mv "$f" "$ul/"
          done

      - name: Committer les resultats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Auto (manuel): chaines d'options par UL $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "Rien de nouveau a committer"
          git push
