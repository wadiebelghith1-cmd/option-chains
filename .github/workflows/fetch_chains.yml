name: Fetch CBOE Option Chains

# Declenchement :
#  - cron programme (heure UTC !)
#  - possibilite de lancer manuellement depuis l'onglet "Actions" de GitHub (bouton "Run workflow")
on:
  schedule:
    # Toutes les 30 min, lun-ven, de 13:00 a 21:30 UTC.
    # Le marche US (NYSE/Nasdaq) est ouvert 9h30-16h00 heure de New York, ce qui donne :
    #   - 13:30-20:00 UTC en heure d'ete US (EDT, ~mars a novembre)
    #   - 14:30-21:00 UTC en heure d'hiver US (EST, le reste de l'annee)
    # La fenetre 13:00-21:30 UTC couvre les deux cas avec ~30-90 min de marge de
    # chaque cote (pas de bascule manuelle a faire au changement d'heure US).
    # GitHub cron ne connait pas les jours feries US (marche ferme) : ces jours-la,
    # le run se declenche quand meme mais recupere juste des donnees figees.
    - cron: "*/30 13-21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write   # necessaire pour que le workflow puisse "git push" les CSV

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dependances
        run: pip install requests pandas xlsxwriter

      - name: Telecharger les chaines d'options
        run: python cboe_option_chain.py SPX AAPL VIX TSLA NDX BMNR META -o data

      - name: Committer les resultats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.csv
          git commit -m "Auto: chaines d'options $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "Rien de nouveau a committer"
          git push
